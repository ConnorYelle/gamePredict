<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchup · gamePredict</title>
<style>
body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}
.topbar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
}
.topbar .back { justify-self: start; }
.topbar .back a {
    color: #60a5fa; text-decoration: none; font-weight: bold; font-size: 15px;
}
.topbar .back a:hover { text-decoration: underline; }
.topbar .brand { justify-self: center; font-size: 20px; font-weight: bold; color: #60a5fa; }
.topbar .date  { justify-self: end; font-size: 15px; color: #94a3b8; white-space: nowrap; }

.wrap { max-width: 760px; margin: 0 auto; }

.banner {
    display: none;
    margin: 0 0 20px;
    padding: 12px 16px;
    border-radius: 10px;
    background: #7f1d1d;
    color: #fecaca;
    text-align: center;
}
.banner.show { display: block; }

.card {
    background: #1e293b;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    border: 3px solid #334155;
}
.card.correct   { border-color: #22c55e; }
.card.incorrect { border-color: #ef4444; }

.status {
    display: inline-block;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.04em;
    padding: 3px 10px;
    border-radius: 999px;
    text-transform: uppercase;
    background: #334155;
    color: #cbd5e1;
    margin-bottom: 14px;
}
.status.live  { background: #b91c1c; color: #fff; }
.status.final { background: #1d4ed8; color: #fff; }

.teams {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
}
.team  { flex: 1 1 0; min-width: 0; text-align: center; }
.team img { width: 110px; height: 110px; max-width: 100%; object-fit: contain; }
.team-name { margin-top: 10px; font-weight: bold; font-size: 18px; min-height: 2.4em; }
.prob { margin-top: 8px; font-size: 30px; font-weight: bold; }

.middle {
    flex: 0 0 auto;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}
.vs { font-size: 24px; font-weight: bold; white-space: nowrap; }
.score { font-size: 40px; font-weight: bold; font-variant-numeric: tabular-nums; white-space: nowrap; }
.winner-side { color: #22c55e; }

.pitchers { margin-top: 18px; text-align: center; font-size: 14px; color: #94a3b8; }
.favorite {
    margin-top: 14px; text-align: center; font-size: 20px; color: #60a5fa;
}
.favorite .mark { font-weight: bold; }
.favorite .mark.correct   { color: #22c55e; }
.favorite .mark.incorrect { color: #ef4444; }
.favorite .no-pred { color: #94a3b8; font-size: 16px; }

.section-title {
    margin: 28px 0 10px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #94a3b8;
}

.detail-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    font-size: 16px;
    border-bottom: 1px solid #243042;
}
.detail-row .dl { color: #94a3b8; text-align: center; font-size: 12px; white-space: nowrap; }
.detail-row .dv { font-variant-numeric: tabular-nums; color: #cbd5e1; font-weight: bold; }
.detail-row .dv.away { text-align: right; }
.detail-row .dv.home { text-align: left; }
.arrow { font-weight: bold; }
.details-unavailable { color: #94a3b8; text-align: center; font-size: 14px; padding: 8px 0; }

.coming-soon {
    margin-top: 12px;
    padding: 18px;
    border: 1px dashed #334155;
    border-radius: 12px;
    text-align: center;
    color: #94a3b8;
    font-size: 14px;
    background: #18233a;
}
</style>
</head>
<body>

<header class="topbar">
    <div class="back"><a id="backLink" href="/">&#8592; Back to dashboard</a></div>
    <div class="brand">gamePredict</div>
    <div class="date" id="date"></div>
</header>

<div class="wrap">
    <div class="banner" id="banner"></div>
    <div id="content"></div>
</div>

<script>
const isNum = v => typeof v === "number" && !Number.isNaN(v);
const fmtStat = (v, dp) => isNum(v) ? Number(v).toFixed(dp) : "—";
const fmtProb = p => isNum(p) ? p.toFixed(1) + "%" : "—";

// Same comparison metrics + colour scale the dashboard's inline panel uses.
const STAT_DEFS = [
    { key: "rpg", label: "Runs / Game",          better: "high", dp: 2, scale: 1.5   },
    { key: "obp", label: "On-Base %",            better: "high", dp: 3, scale: 0.030 },
    { key: "slg", label: "Slugging %",           better: "high", dp: 3, scale: 0.060 },
    { key: "hr",  label: "Home Runs",            better: "high", dp: 0, scale: 25    },
    { key: "rag", label: "Runs Allowed / Game",  better: "low",  dp: 2, scale: 1.5   },
    { key: "fld", label: "Fielding %",           better: "high", dp: 3, scale: 0.010 },
];
const C_NEUTRAL = [148, 163, 184];
const C_BETTER  = [34, 197, 94];
const C_WORSE   = [239, 68, 68];

function mixRgb(from, to, t) {
    const c = from.map((v, i) => Math.round(v + (to[i] - v) * t));
    return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
}
function gradeColor(def, self, other) {
    if (!isNum(self) || !isNum(other) || self === other) return mixRgb(C_NEUTRAL, C_NEUTRAL, 0);
    const t = Math.min(1, Math.abs(self - other) / def.scale);
    const selfBetter = def.better === "high" ? self > other : self < other;
    return mixRgb(C_NEUTRAL, selfBetter ? C_BETTER : C_WORSE, t);
}
function detailRow(def, av, hv) {
    let winner = 0;
    if (isNum(av) && isNum(hv) && av !== hv) {
        const homeBetter = def.better === "high" ? hv > av : hv < av;
        winner = homeBetter ? 1 : -1;
    }
    const awayArrow = winner === -1 ? ` <span class="arrow">&#9664;</span>` : "";
    const homeArrow = winner === 1  ? `<span class="arrow">&#9654;</span> ` : "";
    return `
        <div class="detail-row">
            <div class="dv away" style="color:${gradeColor(def, av, hv)}">${fmtStat(av, def.dp)}${awayArrow}</div>
            <div class="dl">${def.label}</div>
            <div class="dv home" style="color:${gradeColor(def, hv, av)}">${homeArrow}${fmtStat(hv, def.dp)}</div>
        </div>`;
}
function statTable(g) {
    const a = g.awayStats, h = g.homeStats;
    if (!a && !h) return `<div class="details-unavailable">Detailed stats unavailable for this matchup.</div>`;
    return STAT_DEFS.map(def => detailRow(def, a ? a[def.key] : null, h ? h[def.key] : null)).join("");
}

function ordinal(n) {
    if (!isNum(n)) return "";
    const s = ["th", "st", "nd", "rd"], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function statusBadge(g) {
    if (g.state === "live") {
        const half = (g.inningState || "").slice(0, 3);
        return { cls: "live", html: `${half ? half + " " : ""}${ordinal(g.inning)}` };
    }
    if (g.state === "final") return { cls: "final", html: "Final" };
    return { cls: "", html: g.detailedState || "Scheduled" };
}
function middleHtml(g) {
    const hasScore = isNum(g.awayScore) && isNum(g.homeScore);
    if (g.state === "preview" || !hasScore) return `<div class="vs">VS</div>`;
    const awayCls = g.awayScore > g.homeScore ? "winner-side" : "";
    const homeCls = g.homeScore > g.awayScore ? "winner-side" : "";
    return `<div class="score"><span class="${awayCls}">${g.awayScore}</span>
            – <span class="${homeCls}">${g.homeScore}</span></div>`;
}
function pitchersHtml(g) {
    if (g.state === "live" && g.currentPitcher)
        return `On the mound: ${g.currentPitcher}`;
    if (g.awaySp || g.homeSp)
        return `${g.awaySp || "TBD"} <span style="opacity:.5">@</span> ${g.homeSp || "TBD"}`;
    return "Starters: TBD";
}
function favoriteHtml(g) {
    if (!g.favorite) return `<span class="no-pred">No prediction recorded</span>`;
    let mark = "";
    if (g.border === "correct")   mark = ` <span class="mark correct">&#10003;</span>`;
    if (g.border === "incorrect") mark = ` <span class="mark incorrect">&#10007;</span>`;
    return `Predicted Winner: ${g.favorite}${mark}`;
}

function render(payload) {
    const dateEl = document.getElementById("date");
    const content = document.getElementById("content");
    const g = payload.game;
    dateEl.textContent = payload.date || "";

    if (!payload.found || !g) {
        content.innerHTML = `<div class="details-unavailable">Matchup not found for this date.</div>`;
        return;
    }
    document.title = `${g.away} @ ${g.home} · gamePredict`;
    const badge = statusBadge(g);

    content.innerHTML = `
        <div class="card ${g.border}">
            <div class="status ${badge.cls}">${badge.html}</div>
            <div class="teams">
                <div class="team">
                    <img src="${g.awayLogo}" alt="${g.away}">
                    <div class="team-name">${g.away}</div>
                    <div class="prob">${fmtProb(g.awayP)}</div>
                </div>
                <div class="middle">${middleHtml(g)}</div>
                <div class="team">
                    <img src="${g.homeLogo}" alt="${g.home}">
                    <div class="team-name">${g.home}</div>
                    <div class="prob">${fmtProb(g.homeP)}</div>
                </div>
            </div>
            <div class="pitchers">${pitchersHtml(g)}</div>
            <div class="favorite">${favoriteHtml(g)}</div>

            <div class="section-title">Team comparison</div>
            ${statTable(g)}

            <div class="section-title">More matchup stats</div>
            <div class="coming-soon">
                Head-to-head history, pitcher splits, and bullpen detail are
                coming soon to this page.
            </div>
        </div>`;
}

async function load() {
    const params = new URLSearchParams(location.search);
    const date = params.get("date") || "";
    const away = params.get("away") || "";
    const home = params.get("home") || "";

    // Returning to the dashboard preserves the day you came from.
    const back = document.getElementById("backLink");
    back.href = date ? `/?date=${encodeURIComponent(date)}` : "/";

    const banner = document.getElementById("banner");
    try {
        const url = `/api/matchup?date=${encodeURIComponent(date)}` +
                    `&away=${encodeURIComponent(away)}&home=${encodeURIComponent(home)}`;
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        render(await res.json());
    } catch (err) {
        banner.textContent = "Could not load this matchup: " + err.message;
        banner.classList.add("show");
    }
}
load();
</script>

</body>
</html>
