<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MLB Live Predictions</title>

<style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

/* Title bar: brand pinned left, title centered, date pinned right. */
.topbar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
}

.topbar .brand { justify-self: start; font-size: 20px; font-weight: bold; color: #60a5fa; }
.topbar .title { justify-self: center; margin: 0; font-size: 28px; }
.topbar .date  { justify-self: end; font-size: 16px; color: #94a3b8; white-space: nowrap; }

/* Day navigation: prev / date picker / next, plus a jump-to-live button. */
.navbar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
}
.navbar button {
    padding: 8px 14px;
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
}
.navbar button:hover:not(:disabled) { background: #2b3a52; }
.navbar button:disabled { opacity: 0.4; cursor: default; }
.navbar #liveBtn { color: #fca5a5; border-color: #7f1d1d; }
.navbar #liveBtn.active {
    background: #b91c1c; color: #fff; border-color: #b91c1c; cursor: default;
}
.navbar #liveBtn .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; margin-right: 5px;
}
.navbar #liveBtn.active .dot { animation: pulse 1.2s infinite; }
.navbar input[type="date"] {
    padding: 7px 10px;
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #334155;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color-scheme: dark;
}

/* Day record line shown when viewing an archived day. */
.summary {
    text-align: center;
    margin-bottom: 16px;
    font-size: 15px;
    color: #cbd5e1;
    min-height: 1.2em;
}
.summary b { color: #f8fafc; }
.summary .muted { color: #94a3b8; font-size: 13px; }

/* Status line under the title: legend + last-updated clock. */
.statusbar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 28px;
    font-size: 13px;
    color: #94a3b8;
}
.legend { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.swatch.correct   { background: #22c55e; }
.swatch.incorrect { background: #ef4444; }
.swatch.pending   { background: #475569; }

.banner {
    display: none;
    margin: 0 0 20px;
    padding: 10px 14px;
    border-radius: 10px;
    background: #7f1d1d;
    color: #fecaca;
    text-align: center;
    font-size: 14px;
}
.banner.show { display: block; }

.games {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
    align-items: start;
}

.card {
    background: #1e293b;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    /* Border colour signals prediction outcome once a game is final. The
       transition makes the green/red snap in smoothly when a result lands. */
    border: 3px solid #334155;
    transition: border-color 0.4s ease;
}
.card.pending   { border-color: #334155; }
.card.correct   { border-color: #22c55e; }
.card.incorrect { border-color: #ef4444; }

/* Status badge top-right of each card. */
.status {
    align-self: flex-end;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.04em;
    padding: 3px 10px;
    border-radius: 999px;
    text-transform: uppercase;
    background: #334155;
    color: #cbd5e1;
    margin-bottom: 6px;
}
.status.live  { background: #b91c1c; color: #fff; }
.status.final { background: #1d4ed8; color: #fff; }
.status.live .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #fff; margin-right: 5px; animation: pulse 1.2s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

/* The whole card links to the full per-matchup page. */
.card.clickable { cursor: pointer; }
.card.clickable:hover { background: #243049; }
.card.clickable:hover .team-name { text-decoration: underline; }
.card.clickable:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
/* Keep interactive children feeling like themselves, not the card link. */
.card.clickable .details-btn,
.card.clickable .details { cursor: auto; }

/* Three-column matchup row: away | score | home. The side columns flex and may
   wrap their team name; the centre column sizes to the score and never wraps,
   so the two probabilities always line up and the score stays on one line at
   any card width. align-items:flex-start keeps logos (and the probs below the
   fixed-height name block) on a shared baseline. */
.teams {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
}
.team  { flex: 1 1 0; min-width: 0; text-align: center; }
.team img { width: 90px; height: 90px; max-width: 100%; object-fit: contain; }
.team-name { margin-top: 10px; font-weight: bold; min-height: 2.6em; }
.prob { margin-top: 8px; font-size: 24px; font-weight: bold; }

/* Centre column: shows "VS" before first pitch, the live/final score after.
   Fixed to the logo height and centred so the score sits between the logos. */
.middle {
    flex: 0 0 auto;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}
.vs    { font-size: 22px; font-weight: bold; white-space: nowrap; }
.score { font-size: 30px; font-weight: bold; font-variant-numeric: tabular-nums; white-space: nowrap; }
.winner-side { color: #22c55e; }

.pitchers {
    margin-top: 16px;
    text-align: center;
    font-size: 13px;
    color: #94a3b8;
    min-height: 2.4em;
}
.pitchers .mound { color: #e2e8f0; }

.favorite {
    margin-top: 12px;
    text-align: center;
    font-size: 18px;
    color: #60a5fa;
    min-height: 2.6em;
}
.favorite .mark { font-weight: bold; }
.favorite .mark.correct   { color: #22c55e; }
.favorite .mark.incorrect { color: #ef4444; }
.favorite .no-pred { color: #94a3b8; font-size: 15px; }

.details-btn {
    margin-top: auto;
    width: 100%;
    padding: 10px;
    background: #334155;
    color: #e2e8f0;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.15s ease;
}
.details-btn:hover { background: #3e4c63; }

.details {
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    margin-top: 0;
    padding-top: 0;
    border-top: 0 solid #334155;
    transition: max-height 0.35s ease, opacity 0.25s ease,
                margin-top 0.35s ease, padding-top 0.35s ease;
}
.details.open {
    max-height: 600px;
    opacity: 1;
    margin-top: 14px;
    padding-top: 10px;
    border-top-width: 1px;
}

.detail-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-size: 15px;
}
.detail-row .dl { color: #94a3b8; text-align: center; font-size: 12px; white-space: nowrap; }
.detail-row .dv { font-variant-numeric: tabular-nums; color: #cbd5e1; font-weight: bold; }
.detail-row .dv.away { text-align: right; }
.detail-row .dv.home { text-align: left; }
.arrow { font-weight: bold; }
.details-unavailable { color: #94a3b8; text-align: center; font-size: 13px; padding: 6px 0; }

.empty { grid-column: 1 / -1; text-align: center; color: #94a3b8; font-size: 16px; padding: 40px; }

</style>
</head>

<body>

<header class="topbar">
    <div class="brand">gamePredict</div>
    <h1 class="title">MLB Live Predictions</h1>
    <div class="date" id="date"></div>
</header>

<nav class="navbar">
    <button id="prevBtn" type="button">&#9664; Prev day</button>
    <input type="date" id="datePicker" aria-label="Jump to a date">
    <button id="nextBtn" type="button">Next day &#9654;</button>
    <button id="liveBtn" type="button"><span class="dot"></span>Live</button>
</nav>

<div class="summary" id="summary"></div>

<div class="statusbar">
    <span class="legend"><span class="swatch correct"></span>Prediction correct</span>
    <span class="legend"><span class="swatch incorrect"></span>Prediction wrong</span>
    <span class="legend"><span class="swatch pending"></span>In progress / scheduled</span>
    <span id="updated"></span>
</div>

<div class="banner" id="banner"></div>

<div class="games" id="games"></div>

<script>

const REFRESH_MS = 30000;
const container = document.getElementById("games");
const banner = document.getElementById("banner");
const dateEl = document.getElementById("date");
const updatedEl = document.getElementById("updated");
const summaryEl = document.getElementById("summary");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const liveBtn = document.getElementById("liveBtn");
const datePicker = document.getElementById("datePicker");

// Matchups whose detail panel the user has opened, so a refresh-rebuild doesn't
// snap them shut.
const openDetails = new Set();
const keyOf = g => `${g.away}@${g.home}`;

// ----- matchup detail panel (same stats/gradient as the static preview) ---- //
const STAT_DEFS = [
    { key: "rpg", label: "Runs / Game",          better: "high", dp: 2, scale: 1.5   },
    { key: "obp", label: "On-Base %",            better: "high", dp: 3, scale: 0.030 },
    { key: "slg", label: "Slugging %",           better: "high", dp: 3, scale: 0.060 },
    { key: "hr",  label: "Home Runs",            better: "high", dp: 0, scale: 25    },
    { key: "rag", label: "Runs Allowed / Game",  better: "low",  dp: 2, scale: 1.5   },
    { key: "fld", label: "Fielding %",           better: "high", dp: 3, scale: 0.010 },
];
const C_NEUTRAL = [148, 163, 184];
const C_BETTER  = [34, 197, 94];
const C_WORSE   = [239, 68, 68];

const isNum = v => typeof v === "number" && !Number.isNaN(v);
const fmtStat = (v, dp) => isNum(v) ? Number(v).toFixed(dp) : "—";
// Probabilities are absent for archived days saved before predictions were
// snapshotted, so render a dash rather than crashing on null.
const fmtProb = p => isNum(p) ? p.toFixed(1) + "%" : "—";

function mixRgb(from, to, t) {
    const c = from.map((v, i) => Math.round(v + (to[i] - v) * t));
    return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
}
function gradeColor(def, self, other) {
    if (!isNum(self) || !isNum(other) || self === other) return mixRgb(C_NEUTRAL, C_NEUTRAL, 0);
    const t = Math.min(1, Math.abs(self - other) / def.scale);
    const selfBetter = def.better === "high" ? self > other : self < other;
    return mixRgb(C_NEUTRAL, selfBetter ? C_BETTER : C_WORSE, t);
}
function detailRow(def, av, hv) {
    let winner = 0;
    if (isNum(av) && isNum(hv) && av !== hv) {
        const homeBetter = def.better === "high" ? hv > av : hv < av;
        winner = homeBetter ? 1 : -1;
    }
    const awayArrow = winner === -1 ? ` <span class="arrow">&#9664;</span>` : "";
    const homeArrow = winner === 1  ? `<span class="arrow">&#9654;</span> ` : "";
    return `
        <div class="detail-row">
            <div class="dv away" style="color:${gradeColor(def, av, hv)}">${fmtStat(av, def.dp)}${awayArrow}</div>
            <div class="dl">${def.label}</div>
            <div class="dv home" style="color:${gradeColor(def, hv, av)}">${homeArrow}${fmtStat(hv, def.dp)}</div>
        </div>`;
}
function buildDetails(g) {
    const a = g.awayStats, h = g.homeStats;
    if (!a && !h) return `<div class="details-unavailable">Detailed stats unavailable for this matchup.</div>`;
    return STAT_DEFS.map(def => detailRow(def, a ? a[def.key] : null, h ? h[def.key] : null)).join("");
}

// ----- live presentation helpers ------------------------------------------ //
function ordinal(n) {
    if (!isNum(n)) return "";
    const s = ["th", "st", "nd", "rd"], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function startTimeLabel(g) {
    if (!g.startTime) return "";
    const d = new Date(g.startTime);
    if (isNaN(d)) return "";
    return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}
function statusBadge(g) {
    if (g.state === "live") {
        const half = (g.inningState || "").slice(0, 3);
        const inn = ordinal(g.inning);
        return { cls: "live", html: `<span class="dot"></span>${half ? half + " " : ""}${inn}` };
    }
    if (g.state === "final") return { cls: "final", html: "Final" };
    if (g.state === "preview") {
        const t = startTimeLabel(g);
        return { cls: "", html: t ? `Scheduled · ${t}` : "Scheduled" };
    }
    return { cls: "", html: g.detailedState || "—" };
}
function middleHtml(g) {
    const hasScore = isNum(g.awayScore) && isNum(g.homeScore);
    if (g.state === "preview" || !hasScore) return `<div class="vs">VS</div>`;
    const awayCls = g.awayScore > g.homeScore ? "winner-side" : "";
    const homeCls = g.homeScore > g.awayScore ? "winner-side" : "";
    return `<div class="score"><span class="${awayCls}">${g.awayScore}</span>
            – <span class="${homeCls}">${g.homeScore}</span></div>`;
}
function pitchersHtml(g) {
    if (g.state === "live" && g.currentPitcher)
        return `<span class="mound">On the mound: ${g.currentPitcher}</span>`;
    if (g.awaySp || g.homeSp)
        return `${g.awaySp || "TBD"} <span style="opacity:.5">@</span> ${g.homeSp || "TBD"}`;
    return "Starters: TBD";
}
function favoriteHtml(g) {
    if (!g.favorite) return `<span class="no-pred">No prediction recorded</span>`;
    let mark = "";
    if (g.border === "correct")   mark = ` <span class="mark correct">&#10003;</span>`;
    if (g.border === "incorrect") mark = ` <span class="mark incorrect">&#10007;</span>`;
    return `Predicted Winner: ${g.favorite}${mark}`;
}

function buildCard(g) {
    const card = document.createElement("div");
    card.className = `card clickable ${g.border}`;
    const badge = statusBadge(g);
    const key = keyOf(g);

    const params = new URLSearchParams({ date: viewDate || "", away: g.away, home: g.home });
    const matchupHref = "/matchup?" + params.toString();

    card.innerHTML = `
        <div class="status ${badge.cls}">${badge.html}</div>
        <div class="teams">
            <div class="team">
                <img src="${g.awayLogo}" alt="${g.away}">
                <div class="team-name">${g.away}</div>
                <div class="prob">${fmtProb(g.awayP)}</div>
            </div>
            <div class="middle">${middleHtml(g)}</div>
            <div class="team">
                <img src="${g.homeLogo}" alt="${g.home}">
                <div class="team-name">${g.home}</div>
                <div class="prob">${fmtProb(g.homeP)}</div>
            </div>
        </div>
        <div class="pitchers">${pitchersHtml(g)}</div>
        <div class="favorite">${favoriteHtml(g)}</div>
        <button class="details-btn" type="button"></button>
        <div class="details">${buildDetails(g)}</div>
    `;

    const btn = card.querySelector(".details-btn");
    const panel = card.querySelector(".details");
    const setLabel = open => btn.innerHTML = open ? "Hide details &#9652;" : "Matchup details &#9662;";

    if (openDetails.has(key)) { panel.classList.add("open"); setLabel(true); } else setLabel(false);

    btn.addEventListener("click", () => {
        const open = panel.classList.toggle("open");
        setLabel(open);
        if (open) openDetails.add(key); else openDetails.delete(key);
    });

    // The whole card navigates to the matchup page, except interactions with
    // the inline details control/panel (so expanding stats doesn't navigate)
    // and ordinary text selection.
    const navigate = () => { window.location.href = matchupHref; };
    const fromDetails = e => e.target.closest(".details-btn, .details");
    card.addEventListener("click", e => {
        if (fromDetails(e) || window.getSelection().toString()) return;
        navigate();
    });
    // Keyboard access: the card behaves like a link.
    card.setAttribute("role", "link");
    card.setAttribute("tabindex", "0");
    card.setAttribute("aria-label", `${g.away} at ${g.home} — view matchup`);
    card.addEventListener("keydown", e => {
        if ((e.key === "Enter" || e.key === " ") && !fromDetails(e)) {
            e.preventDefault();
            navigate();
        }
    });
    return card;
}

// ----- day navigation: live (today) <-> archived past days ----------------- //
// `mode` is "live" or "history". In live mode we poll /api/live every 30s; in
// history mode we fetch a single graded /api/history?date=… snapshot and stop
// polling. `availableDates` (ascending YYYY-MM-DD) bounds the picker and drives
// the prev/next buttons; `liveDate` is whatever today's live payload reports.
let mode = "live";
let currentDate = null;          // selected day while in history mode
let liveDate = null;             // today's date, from the live payload
let viewDate = "";               // date currently shown (drives matchup links)
let availableDates = [];         // archived days that can be reviewed
let pollTimer = null;

function startPolling() {
    stopPolling();
    refresh();
    pollTimer = setInterval(refresh, REFRESH_MS);
}
function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function goLive() {
    mode = "live";
    currentDate = null;
    banner.classList.remove("show");
    startPolling();
}

async function showHistory(date) {
    mode = "history";
    currentDate = date;
    stopPolling();
    try {
        const res = await fetch("/api/history?date=" + encodeURIComponent(date),
                                { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        render(await res.json());
    } catch (err) {
        banner.textContent = "Could not load archived results: " + err.message;
        banner.classList.add("show");
        updateNav();
    }
}

function prevDay() {
    const cur = mode === "live" ? (liveDate || "9999-99-99") : currentDate;
    const earlier = availableDates.filter(d => d < cur);
    if (earlier.length) showHistory(earlier[earlier.length - 1]);
}
function nextDay() {
    if (mode === "live") return;
    const later = availableDates.filter(d => d > currentDate);
    if (later.length) showHistory(later[0]);
    else goLive();
}

function updateNav() {
    const cur = mode === "live" ? (liveDate || "9999-99-99") : currentDate;
    prevBtn.disabled = !availableDates.some(d => d < cur);
    nextBtn.disabled = mode === "live";
    liveBtn.classList.toggle("active", mode === "live");
    if (availableDates.length) {
        datePicker.min = availableDates[0];
        datePicker.max = liveDate || availableDates[availableDates.length - 1];
    }
    datePicker.value = mode === "live" ? (liveDate || "") : currentDate;
}

function renderSummary(payload) {
    if (payload.mode !== "history") { summaryEl.innerHTML = ""; return; }
    const s = payload.summary;
    if (s) {
        summaryEl.innerHTML = `Record: <b>${s.correct}&ndash;${s.incorrect}</b>` +
            ` &middot; ${s.accuracy}% correct &middot; Brier ${s.brier}` +
            ` <span class="muted">(${s.games} games)</span>`;
    } else if (payload.hasPredictions) {
        summaryEl.innerHTML =
            `<span class="muted">Predictions saved for this day &mdash; ` +
            `results aren't in yet, so they can't be graded.</span>`;
    } else if ((payload.games || []).length) {
        summaryEl.innerHTML =
            `<span class="muted">No saved predictions for this day &mdash; ` +
            `showing final scores only.</span>`;
    } else {
        summaryEl.innerHTML = "";
    }
}

function render(payload) {
    viewDate = payload.date || "";
    dateEl.textContent = payload.date || "";
    if (payload.error) { banner.textContent = payload.error; banner.classList.add("show"); }
    else banner.classList.remove("show");

    container.innerHTML = "";
    const games = payload.games || [];
    if (!games.length) {
        const msg = payload.mode === "history"
            ? "No archived games for this date."
            : "No games scheduled for this date.";
        container.innerHTML = `<div class="empty">${msg}</div>`;
    } else {
        games.forEach(g => container.appendChild(buildCard(g)));
    }

    if (payload.mode === "history") {
        updatedEl.textContent = "Archived final results";
    } else {
        updatedEl.textContent = "Updated " + new Date().toLocaleTimeString();
    }
    renderSummary(payload);
    updateNav();
}

async function refresh() {
    if (mode !== "live") return;  // a stray timer must never clobber history
    try {
        const res = await fetch("/api/live", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const payload = await res.json();
        liveDate = payload.date || liveDate;
        render(payload);
    } catch (err) {
        banner.textContent = "Could not reach the live server: " + err.message;
        banner.classList.add("show");
    }
}

prevBtn.addEventListener("click", prevDay);
nextBtn.addEventListener("click", nextDay);
liveBtn.addEventListener("click", () => { if (mode !== "live") goLive(); });
datePicker.addEventListener("change", () => {
    const v = datePicker.value;
    if (!v) return;
    if (liveDate && v >= liveDate) goLive(); else showHistory(v);
});

async function init() {
    try {
        const res = await fetch("/api/history/dates", { cache: "no-store" });
        availableDates = (await res.json()).dates || [];
    } catch (err) { /* navigation still works for live-only */ }

    // Returning from a matchup page (or a shared link) can request a specific
    // archived day via ?date=; otherwise open in live mode.
    const wanted = new URLSearchParams(location.search).get("date");
    if (wanted && availableDates.includes(wanted)) showHistory(wanted);
    else goLive();
}
init();

</script>

</body>
</html>
